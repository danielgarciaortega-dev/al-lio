name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA with successful canonical main CI
        required: true
        type: string

permissions: {}

concurrency:
  group: al-lio-production
  cancel-in-progress: false

jobs:
  authorize-manual:
    name: Authorize manual exact CI
    if: >-
      github.event_name == 'workflow_dispatch' &&
      vars.PRODUCTION_AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      release_sha: ${{ steps.attest.outputs.release_sha }}

    steps:
      - name: Attest requested SHA to successful canonical main CI
        id: attest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Release SHA must contain exactly 40 lowercase hexadecimal characters." >&2
            exit 1
          }

          attestation_file="$RUNNER_TEMP/manual-ci-runs.json"
          gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f status=completed \
            -f head_sha="$RELEASE_SHA" \
            -f per_page=100 \
            > "$attestation_file"

          node - "$attestation_file" "$RELEASE_SHA" "$REPOSITORY" <<'NODE'
          const fs = require("node:fs");

          const [attestationFile, releaseSha, repository] = process.argv.slice(2);
          let response;
          try {
            response = JSON.parse(fs.readFileSync(attestationFile, "utf8"));
          } catch (error) {
            console.error(`Unable to parse CI attestation response: ${error.message}`);
            process.exit(1);
          }

          if (!Array.isArray(response.workflow_runs) || !Number.isInteger(response.total_count)) {
            console.error("CI attestation response is missing workflow run metadata.");
            process.exit(1);
          }

          if (response.total_count !== response.workflow_runs.length) {
            console.error("CI attestation response is incomplete or paginated; refusing an ambiguous result.");
            process.exit(1);
          }

          const exactRuns = response.workflow_runs.filter(
            (run) =>
              run?.head_sha === releaseSha &&
              run?.event === "push" &&
              run?.head_branch === "main" &&
              run?.status === "completed" &&
              run?.head_repository?.full_name === repository &&
              run?.path === ".github/workflows/ci.yml",
          );

          if (exactRuns.length !== 1) {
            console.error(
              `Expected exactly one completed canonical-main CI run for ${releaseSha}; found ${exactRuns.length}.`,
            );
            process.exit(1);
          }

          const [run] = exactRuns;
          if (run.conclusion !== "success") {
            console.error(
              `Canonical-main CI run ${run.id ?? "unknown"} concluded ${run.conclusion ?? "unknown"}; refusing deployment.`,
            );
            process.exit(1);
          }

          console.log(
            `Authorized manual deployment from CI run ${run.id ?? "unknown"} for ${releaseSha}.`,
          );
          NODE

          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy exact main SHA
    needs: authorize-manual
    if: >-
      always() &&
      vars.PRODUCTION_AUTO_DEPLOY_ENABLED == 'true' &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          needs.authorize-manual.result == 'success' &&
          needs.authorize-manual.outputs.release_sha == inputs.release_sha
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {}
    environment:
      name: Production
      url: https://al-lio.app
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || needs.authorize-manual.outputs.release_sha }}
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}

    steps:
      - name: Validate immutable release and deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Release SHA must contain exactly 40 lowercase hexadecimal characters." >&2
            exit 1
          }
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || {
            echo "PRODUCTION_SSH_HOST contains unsupported characters." >&2
            exit 1
          }
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || {
            echo "PRODUCTION_SSH_USER contains unsupported characters." >&2
            exit 1
          }
          SSH_PORT="${SSH_PORT:-22}"
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]] && ((SSH_PORT >= 1 && SSH_PORT <= 65535)) || {
            echo "PRODUCTION_SSH_PORT must be a valid TCP port." >&2
            exit 1
          }
          [[ -n "$SSH_PRIVATE_KEY" ]] || {
            echo "PRODUCTION_SSH_PRIVATE_KEY is missing." >&2
            exit 1
          }
          [[ -n "$SSH_KNOWN_HOSTS" ]] || {
            echo "PRODUCTION_SSH_KNOWN_HOSTS is missing." >&2
            exit 1
          }
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"

      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/al-lio-production"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/al-lio-production" "$HOME/.ssh/known_hosts"

      - name: Deploy exact merge SHA through the validated VPS command
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/al-lio-production" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "deploy $RELEASE_SHA"

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/al-lio-production" "$HOME/.ssh/known_hosts"
