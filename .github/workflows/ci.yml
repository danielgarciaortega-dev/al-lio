name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: al-lio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck production scripts
        env:
          SHELLCHECK_VERSION: "0.10.0"
          SHELLCHECK_ARCHIVE_SHA256: "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87"
        run: |
          set -Eeuo pipefail
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          archive_path="$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive_path" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$archive"
          printf '%s  %s\n' "$SHELLCHECK_ARCHIVE_SHA256" "$archive_path" | sha256sum --check
          tar -xJf "$archive_path" -C "$RUNNER_TEMP"
          shellcheck_bin="$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          "$shellcheck_bin" --version
          mapfile -t production_shell_scripts < <(git ls-files '*.sh')
          test "${#production_shell_scripts[@]}" -gt 0
          "$shellcheck_bin" -x "${production_shell_scripts[@]}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository verification
        run: npm run ci

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: al_lio_e2e
          POSTGRES_PASSWORD: al_lio_e2e
          POSTGRES_DB: al_lio_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U al_lio_e2e -d al_lio_e2e"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      # An ephemeral, loopback-only database and a local app port. No
      # production secret is read; tests/e2e/support/env.ts fails the job if
      # any of these ever point somewhere real.
      E2E_MANAGE_DB: "false"
      E2E_DATABASE_URL: postgresql://al_lio_e2e:al_lio_e2e@127.0.0.1:5432/al_lio_e2e
      E2E_BASE_URL: http://127.0.0.1:3210
      E2E_APP_PORT: "3210"
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run the isolated E2E suite
        run: npm run e2e

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
