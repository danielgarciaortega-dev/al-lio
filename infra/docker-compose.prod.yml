services:
  al_lio_web:
    image: al-lio-web:${AL_LIO_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: al_lio_web
    restart: unless-stopped
    init: true
    user: nextjs
    read_only: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      PORT: "3000"
      AL_LIO_RELEASE_SHA: ${AL_LIO_RELEASE_SHA:?AL_LIO_RELEASE_SHA is injected by the release mechanism}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      AL_LIO_RADAR_WEBHOOK_SECRET: ${AL_LIO_RADAR_WEBHOOK_SECRET:?AL_LIO_RADAR_WEBHOOK_SECRET is required}
      AL_LIO_RADAR_V4_PROJECT_DESTINATIONS: ${AL_LIO_RADAR_V4_PROJECT_DESTINATIONS:-}
      AL_LIO_RADAR_LEARNING_INGEST_ENABLED: ${AL_LIO_RADAR_LEARNING_INGEST_ENABLED:-false}
      AL_LIO_VERIFIED_OPPORTUNITIES_ONLY: ${AL_LIO_VERIFIED_OPPORTUNITIES_ONLY:-false}
      TARGET_USER_EMAIL: ${TARGET_USER_EMAIL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_IDENTITY_REDIRECT_URI: ${GOOGLE_IDENTITY_REDIRECT_URI:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      BASE_URL: ${BASE_URL:?BASE_URL is required}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      PG_IDLE_TIMEOUT_MS: ${PG_IDLE_TIMEOUT_MS:-30000}
      PG_CONNECTION_TIMEOUT_MS: ${PG_CONNECTION_TIMEOUT_MS:-5000}
      PG_STATEMENT_TIMEOUT_MS: ${PG_STATEMENT_TIMEOUT_MS:-15000}
    expose:
      - "3000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=1001,gid=1001
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=128m,uid=1001,gid=1001
    mem_limit: 1536m
    mem_reservation: 256m
    cpus: 2.0
    pids_limit: 256
    networks:
      - danicode_web
      - al_lio_internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      al_lio_postgres:
        condition: service_healthy

  al_lio_radar:
    image: al-lio-radar:${AL_LIO_RADAR_IMAGE_TAG:-local}
    build:
      context: ${AL_LIO_RADAR_BUILD_CONTEXT:-../../al-lio-radar}
      dockerfile: Dockerfile
    container_name: al_lio_radar
    restart: unless-stopped
    init: true
    user: radar
    read_only: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${AL_LIO_RADAR_LOG_LEVEL:-info}
      AL_LIO_WEBHOOK_URL: ${BASE_URL:?BASE_URL is required}
      AL_LIO_RADAR_WEBHOOK_SECRET: ${AL_LIO_RADAR_WEBHOOK_SECRET:?AL_LIO_RADAR_WEBHOOK_SECRET is required}
      DATABASE_PATH: /app/data/al-lio-radar.sqlite
      HTTP_USER_AGENT: al-lio-radar/1.0 (+https://github.com/danicode-dev/al-lio-radar)
      HTTP_TIMEOUT_MS: ${AL_LIO_RADAR_HTTP_TIMEOUT_MS:-10000}
      HTTP_MAX_RETRIES: ${AL_LIO_RADAR_HTTP_MAX_RETRIES:-3}
      HTTP_RATE_LIMIT_PER_HOST_MS: ${AL_LIO_RADAR_RATE_LIMIT_MS:-2000}
      HTTP_MAX_BODY_BYTES: ${AL_LIO_RADAR_MAX_BODY_BYTES:-5000000}
      DELIVERY_BATCH_SIZE: ${AL_LIO_RADAR_DELIVERY_BATCH_SIZE:-100}
      AL_LIO_DELIVERY_SCHEMA_VERSION: ${AL_LIO_RADAR_DELIVERY_SCHEMA_VERSION:-3}
      AUTONOMOUS_PUBLICATION_ENABLED: ${AL_LIO_RADAR_AUTONOMOUS_PUBLICATION_ENABLED:-false}
      AUTONOMOUS_PUBLICATION_DESTINATIONS: ${AL_LIO_RADAR_AUTONOMOUS_PUBLICATION_DESTINATIONS:-news}
      AUTONOMOUS_NEWS_SOURCE_CYCLE_MATRIX_JSON: ${AL_LIO_RADAR_AUTONOMOUS_NEWS_SOURCE_CYCLE_MATRIX_JSON:-}
      DAILY_PUBLICATION_TIMEZONE: ${AL_LIO_RADAR_DAILY_PUBLICATION_TIMEZONE:-Europe/Madrid}
      DAILY_PUBLICATION_TIME: ${AL_LIO_RADAR_DAILY_PUBLICATION_TIME:-09:00}
      WEB_DISCOVERY_ENABLED: ${AL_LIO_RADAR_WEB_DISCOVERY_ENABLED:-false}
      LEARNING_DISCOVERY_ENABLED: ${AL_LIO_RADAR_LEARNING_DISCOVERY_ENABLED:-false}
      YOUTUBE_WATCH_ENABLED: ${AL_LIO_RADAR_YOUTUBE_WATCH_ENABLED:-false}
      LEARNING_DELIVERY_ENABLED: ${AL_LIO_RADAR_LEARNING_DELIVERY_ENABLED:-false}
      YOUTUBE_API_KEY: ${AL_LIO_RADAR_YOUTUBE_API_KEY:-}
      JOB_RADAR_ENABLED: ${AL_LIO_RADAR_JOB_RADAR_ENABLED:-false}
    volumes:
      - al_lio_radar_data:/app/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    pids_limit: 128
    networks:
      - danicode_web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      al_lio_web:
        condition: service_healthy

  al_lio_migrator:
    image: al-lio-web:${AL_LIO_IMAGE_TAG:-local}
    profiles: ["ops"]
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1001,gid=1001
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?DATABASE_MIGRATION_URL is required}
      AL_LIO_BASELINE_CONFIRMATION: ${AL_LIO_BASELINE_CONFIRMATION:-}
      AL_LIO_BASELINE_RECONCILIATION: ${AL_LIO_BASELINE_RECONCILIATION:-}
      AL_LIO_DB_ROLE_CONFIRMATION: ${AL_LIO_DB_ROLE_CONFIRMATION:-}
    command: ["node", "scripts/postgres/migrate.mjs"]
    networks:
      - al_lio_internal
    depends_on:
      al_lio_postgres:
        condition: service_healthy

  al_lio_postgres:
    image: postgres:17-alpine
    container_name: al_lio_postgres
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    shm_size: 256mb
    mem_limit: 1g
    mem_reservation: 128m
    cpus: 2.0
    pids_limit: 256
    environment:
      POSTGRES_DB: al_lio
      POSTGRES_USER: al_lio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - al_lio_postgres_data:/var/lib/postgresql/data
    networks:
      - al_lio_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U al_lio -d al_lio"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  danicode_web:
    external: true
  al_lio_internal:
    name: al_lio_backend_internal
    internal: true

volumes:
  al_lio_postgres_data:
  al_lio_radar_data:
    name: al_lio_radar_data
